[project]
name = "ai-text-trust-service"
version = "0.3.0"
description = "Сервис для определения текстов, сгенерированных ИИ"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Observability
    "prometheus-client>=0.24.1",
    "python-json-logger>=4.0.0",
    # ML inference (TF-IDF detector — дефолтный путь)
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.23",
    "scipy>=1.10",
    # Стилометрия для /analyze?explain=true (markers.py → extract_all → DataFrame)
    "pandas>=2.0",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "uuid-utils>=0.9",
    "python-dotenv>=1.0",  # alembic/env.py:9 — load_dotenv() при `alembic upgrade head`
    # Configuration / YAML I/O
    "pyyaml>=6.0.3",
    # Auth
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "email-validator>=2.1.0",
    "slowapi>=0.1.9",
    # File extraction (DOCX / PDF / CSV upload)
    "python-docx>=1.2.0",
    "pypdf>=5.0.0",
    "chardet>=5.2.0",
    # Artifact sync (тот же образ используется контейнером artifact-sync в проде)
    "boto3>=1.43.4",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24",
    "httpx>=0.28.1",
    "testcontainers[postgres]>=4.0",
    "requests>=2.31",  # scripts/prod_e2e_latency.py — e2e benchmark
]

# Трансформер / cascade detector. В проде включается через --group ml.
# Образ с DETECTOR_TYPE=tfidf может собираться без неё (~1.5 GB меньше).
ml = [
    "torch>=2.0",
    "transformers>=5.4.0",
    "accelerate>=1.13.0",
    "sentencepiece>=0.2.1",
    "sacremoses>=0.1.1",
]

# Ноутбуки: EDA, robustness, эксперименты, графики. В прод не нужно.
notebooks = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "ipykernel>=6.0",
    "shap>=0.51.0",
    "lightgbm>=4.6.0",
]

# Скрипты сбора датасета (scripts/data_collection/*). В прод не нужно.
data = [
    "datasets>=2.16",
    "zstandard",
    "jsonlines",
    "pysimdjson",
    "openai>=1.0",
    "gigachat>=0.1.40",
    "google-genai>=1.69.0",
]

# Gradio demo (`make demo` / `make demo-offline`). В прод не нужно.
demo = [
    "gradio>=5.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "data: needs data/splits/*.jsonl — dataset integrity, not the API runtime",
]

# Локальный `uv sync` ставит main + dev + ml (нужно для тестов cascade-детектора).
# Группы notebooks/data/demo подсасываются явным `--group <name>` или `--all-groups`.
# Прод-Dockerfile использует `--no-dev --group ml` (см. docker/Dockerfile).
[tool.uv]
default-groups = ["dev", "ml"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# По умолчанию CPU torch (~500 MB вместо 5-7 GB CUDA-варианта).
# Прод-инференс TF-IDF torch не использует. Для cascade включаем `--group ml`.
# Для CUDA-обучения локально: `uv sync --group ml --index pytorch-cu124`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
