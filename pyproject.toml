[project]
name = "ai-text-trust-service"
version = "0.1.0"
description = "Сервис для определения текстов, сгенерированных ИИ"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # API framework
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.40.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    # Observability
    "prometheus-client>=0.24.1",
    "python-json-logger>=4.0.0",
    # ML
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.23",
    "scipy>=1.10",
    # LLM backends (data generation)
    "openai>=1.0",
    "gigachat>=0.1.40",
    "requests>=2.31",
    "python-dotenv>=1.0",
    # Human data download
    "datasets>=2.16",
    "zstandard",
    "jsonlines",
    "pysimdjson",
    # Utils
    "pyyaml>=6.0.3",
    # Notebooks
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "ipykernel>=6.0",
    "google-genai>=1.69.0",
    "jinja2>=3.1.6",
    "lightgbm>=4.6.0",
    "shap>=0.51.0",
    "torch>=2.0",
    "transformers>=5.4.0",
    "accelerate>=1.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "pytest>=9.0.2",
    "httpx>=0.28.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E501", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.hatch.build.targets.wheel]
packages = ["src/app", "scripts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
