services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://aitrust:aitrust@db:5432/aitrust"
      DETECTOR_TYPE: "tfidf"
      # SERVICE_VERSION резолвится Settings из pyproject.toml.
      MODEL_VERSION: "ru-detector-0.1.0"
      MIN_CHARS: "300"
      MAX_CHARS: "8000"
      RISK_THRESH_LOW: "0.30"
      RISK_THRESH_HIGH: "0.70"
      IS_PRODUCTION: "false"
      JWT_SECRET: "local-dev-jwt-secret-thirty-two-bytes-or-more-for-testing"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 3
      # alembic upgrade + warmup детектора ~10-20с — даём запас перед unhealthy.
      start_period: 30s

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: "postgresql+asyncpg://aitrust:aitrust@db:5432/aitrust"
      DETECTOR_TYPE: "tfidf"
      MODEL_VERSION: "ru-detector-0.1.0"
      MIN_CHARS: "300"
      MAX_CHARS: "8000"
      RISK_THRESH_LOW: "0.30"
      RISK_THRESH_HIGH: "0.70"
      IS_PRODUCTION: "false"
      JWT_SECRET: "local-dev-jwt-secret-thirty-two-bytes-or-more-for-testing"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../artifacts:/app/artifacts:ro
    stop_grace_period: 60s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aitrust
      POSTGRES_PASSWORD: aitrust
      POSTGRES_DB: aitrust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitrust"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
